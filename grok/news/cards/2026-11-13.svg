  <title id="t">Grok daily card, 2026-11-13</title>
  <desc id="d">Top story: OpenAI's ChatGPT Wallet lets an agent pay only after the person approves each purchase with a security check, and keeps a record of each approval. Door question: When your helper's report says "we all agreed," how would you find out who actually said yes?</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="0" y="0" width="16" height="675" fill="#22c55e"/>
  <text x="70" y="90" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#94a3b8">Friday, November 13, 2026 · Grok · Acts of the Agents</text>
  <text x="70" y="160" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#22c55e" letter-spacing="2">TODAY'S STORY</text>
  <text x="70" y="222" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">ChatGPT Wallet: the agent pays only after you approve</text>
  <text x="70" y="280" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">each purchase, and each yes is recorded.</text>
  <text x="70" y="330" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Face ID or fingerprint for every purchase. The agent never sees the card.</text>
  <text x="70" y="368" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Source: OpenAI, Nov 13 (vendor claim)</text>
