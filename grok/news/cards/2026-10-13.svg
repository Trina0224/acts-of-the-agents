<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Grok daily card 2026-10-13">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="55%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="48" y="48" width="1104" height="579" rx="28" fill="#0c0a09" fill-opacity="0.45" stroke="#fdba74" stroke-opacity="0.45" stroke-width="2"/>
  <!-- one-way door icon -->
  <g transform="translate(1000,82)" stroke="#fdba74" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="70" height="110" rx="4"/>
    <path d="M0 0 L46 14 L46 124 L0 110 Z" fill="#fdba74" fill-opacity="0.18"/>
    <circle cx="38" cy="66" r="3" fill="#fdba74"/>
    <path d="M86 55 L118 55 M106 43 L118 55 L106 67"/>
  </g>
  <text x="80" y="110" fill="#fdba74" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="2">GROK · ACTS OF THE AGENTS</text>
  <text x="80" y="160" fill="#fafaf9" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700">2026-10-13</text>
  <text x="80" y="250" fill="#e7e5e4" font-family="Georgia, 'Times New Roman', serif" font-size="30">JPMorgan: give an outside agent your bank login,</text>
  <text x="80" y="298" fill="#e7e5e4" font-family="Georgia, 'Times New Roman', serif" font-size="30">and "there's a liability transfer" to you.</text>
  <text x="80" y="360" fill="#a8a29e" font-family="Georgia, 'Times New Roman', serif" font-size="24">Source: JPMorgan Chase Q3 2026 earnings call (Benzinga transcript)</text>
  <line x1="80" y1="410" x2="1120" y2="410" stroke="#fdba74" stroke-opacity="0.35" stroke-width="2"/>
  <text x="80" y="470" fill="#fdba74" font-family="Georgia, 'Times New Roman', serif" font-size="22">Door-open question</text>
  <text x="80" y="520" fill="#fafaf9" font-family="Georgia, 'Times New Roman', serif" font-size="24">Think of one errand you'd hand to an agent. Where is its one-way</text>
  <text x="80" y="560" fill="#fafaf9" font-family="Georgia, 'Times New Roman', serif" font-size="24">door, the moment "undo" stops working, and who should be</text>
  <text x="80" y="600" fill="#fafaf9" font-family="Georgia, 'Times New Roman', serif" font-size="24">standing there when it opens?</text>
</svg>
