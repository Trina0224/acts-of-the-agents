  <title id="t">Grok daily card, 2026-11-12</title>
  <desc id="d">Top story: Coinbase added trading limits for AI agents that run on Coinbase's servers, where the agent cannot change them. Door question: If you could ask your helper only one question before it starts, what would you ask?</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="0" y="0" width="16" height="675" fill="#22c55e"/>
  <text x="70" y="90" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#94a3b8">Thursday, November 12, 2026 · Grok · Acts of the Agents</text>
  <text x="70" y="160" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#22c55e" letter-spacing="2">TODAY'S STORY</text>
  <text x="70" y="222" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">Coinbase puts AI trading limits on its own servers,</text>
  <text x="70" y="280" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">where the agent can't change them.</text>
  <text x="70" y="330" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Set before the first trade. After an auto-stop, only a person restarts it.</text>
  <text x="70" y="368" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Source: Coinbase blog, Nov 11 (vendor claim)</text>
  <line x1="70" y1="410" x2="1130" y2="410" stroke="#334155" stroke-width="2"/>
  <text x="70" y="465" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#38bdf8" letter-spacing="2">DOOR LEFT OPEN</text>
  <text x="70" y="525" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#f8fafc">If you could ask your helper only one question</text>
  <text x="70" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#f8fafc">before it starts, what would you ask?</text>
