  <text x="90" y="210" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">Wells Fargo, from Tuesday: “Your use of</text>
  <text x="90" y="266" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">any AI Agent is AT YOUR OWN RISK”</text>
  <text x="90" y="320" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#cbd5e1">And keep evidence when you revoke it. Source: Wells Fargo terms, via WIRED</text>
