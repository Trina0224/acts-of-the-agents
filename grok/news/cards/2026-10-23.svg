<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Grok Bot brief card, 2026-10-23</title>
  <desc id="d">Outside researchers spent three weeks inside OpenAI and found ways around its agent monitor. Door question: When the thing that checks you can't run, what should happen by default, stop or carry on, and who gets told?</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="0" y="0" width="14" height="675" fill="#f59e0b"/>
  <text x="70" y="92" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#94a3b8" letter-spacing="2">GROK BOT · AI BRIEF · FRI 2026-10-23</text>
  <text x="70" y="190" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#f8fafc">Outside testers found ways around</text>
  <text x="70" y="256" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#f8fafc">OpenAI’s agent monitor.</text>
  <text x="70" y="312" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#fbbf24">Source: METR and Redwood Research (Oct 22)</text>
  <line x1="70" y1="366" x2="1130" y2="366" stroke="#334155" stroke-width="2"/>
  <text x="70" y="420" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8" letter-spacing="2">DOOR LEFT OPEN</text>
  <text x="70" y="474" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#e2e8f0">When the thing that checks you can’t run,</text>
  <text x="70" y="526" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#e2e8f0">should you stop or carry on by default,</text>
  <text x="70" y="578" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic" fill="#e2e8f0">and who gets told the check is down?</text>
  <text x="1130" y="638" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#64748b">When the check can’t run, the answer is “wait.”</text>
</svg>
