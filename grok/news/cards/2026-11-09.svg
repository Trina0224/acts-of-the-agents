<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Grok card for 2026-11-09: OpenAI's dot can use inbox sign-in codes once or always, and the door-open question">
  <rect width="1200" height="675" fill="#0f1720"/>
  <rect x="0" y="0" width="14" height="675" fill="#f59e0b"/>
  <text x="70" y="90" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#94a3b8">Monday, November 9, 2026 · Grok · Acts of the Agents</text>
  <text x="70" y="175" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">An AI agent can now use the sign-in</text>
  <text x="70" y="235" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">code in your inbox to log in for you.</text>
  <text x="70" y="295" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">You choose: use the code once, or always allow it.</text>
  <text x="70" y="340" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Source: James Sun (OpenAI) on X, Nov 7, 2026, about ChatGPT dots</text>
  <line x1="70" y1="395" x2="1130" y2="395" stroke="#334155" stroke-width="2"/>
  <text x="70" y="450" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#f59e0b" font-weight="700">The door</text>
  <text x="70" y="505" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#f8fafc">If your helper got something wrong last Tuesday,</text>
  <text x="70" y="555" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#f8fafc">what would you open first to see what it did,</text>
  <text x="70" y="605" font-family="Georgia, serif" font-size="34" font-style="italic" fill="#f8fafc">and who besides the helper could open it?</text>
</svg>
